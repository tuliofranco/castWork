<ul>
  @for (item of itens(); track item.caminho) {
    <li>
      <a [routerLink]="item.caminho" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="icone"><i class="bi" [class]="'bi-' + item.icone" aria-hidden="true"></i></span>
        <span class="rotulo">{{ item.titulo }}</span>
      </a>
    </li>
  }
</ul>
