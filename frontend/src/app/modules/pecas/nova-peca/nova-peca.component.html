<cw-cabecalho-pagina [titulo]="editando() ? 'Editar peça' : 'Nova peça'" voltarPara="/pecas" voltarRotulo="Peças" />

<cw-estado-lista
  [carregando]="editando() && peca.isLoading()"
  [erro]="!!peca.error()"
  mensagemErro="Não foi possível carregar a peça."
  [vazio]="editando() && peca.hasValue() && !peca.value()"
  iconeVazio="gem"
  tituloVazio="Peça não encontrada."
  descricaoVazio="Ela pode ter sido removida da biblioteca."
  (tentarDeNovo)="peca.reload()"
>
  <a acaoVazio class="btn btn-secundario" routerLink="/pecas">Voltar para as peças</a>
  <form class="cw-formulario" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <fieldset class="tipos">
      <legend class="form-label">Tipo</legend>
      <div class="opcoes">
        @for (opcao of tipos; track opcao.valor) {
          <label class="opcao" [class.marcada]="form.controls.tipo.value === opcao.valor">
            <input type="radio" class="visually-hidden" formControlName="tipo" [value]="opcao.valor" />
            <i class="bi" [class]="'bi-' + opcao.icone" aria-hidden="true"></i>
            {{ opcao.rotulo }}
          </label>
        }
      </div>
    </fieldset>

    <div class="grade">
      <cw-campo class="c6" rotulo="Nome" para="nome" [controle]="form.controls.nome" [mensagens]="{ required: 'Informe o nome da peça.' }">
        <input id="nome" class="form-control" formControlName="nome" placeholder="Ex.: Elo oval" autocomplete="off" />
      </cw-campo>

      <cw-campo class="c2" rotulo="Material" para="material" [opcional]="true" [controle]="form.controls.material">
        <input id="material" class="form-control" formControlName="material" placeholder="Ouro amarelo" />
      </cw-campo>
      <cw-campo class="c2" rotulo="Teor" para="teor" [opcional]="true" [controle]="form.controls.teor" dica="18k ou 750">
        <input id="teor" class="form-control" formControlName="teor" inputmode="numeric" />
      </cw-campo>
      <cw-campo class="c2" rotulo="Peso (g)" para="pesoGramas" [opcional]="true" [controle]="form.controls.pesoGramas" [mensagens]="{ min: 'O peso deve ser maior que zero.' }">
        <input id="pesoGramas" type="number" step="0.001" min="0" inputmode="decimal" class="form-control" formControlName="pesoGramas" />
      </cw-campo>

      @if (podeVerCusto) {
        <cw-campo
          class="c2"
          rotulo="Custo por unidade (R$)"
          para="custo"
          [opcional]="true"
          [controle]="form.controls.custo"
          dica="Quanto custa comprar ou produzir uma unidade, não o preço de venda."
          [mensagens]="{ min: 'O custo não pode ser negativo.' }"
        >
          <input id="custo" type="number" step="0.01" min="0" inputmode="decimal" class="form-control" formControlName="custo" />
        </cw-campo>
      }

      <cw-campo class="c6" rotulo="Descrição" para="descricao" [opcional]="true" [controle]="form.controls.descricao">
        <textarea id="descricao" class="form-control" rows="3" formControlName="descricao"></textarea>
      </cw-campo>
    </div>

    @for (mensagem of errosGerais(); track mensagem) {
      <p class="aviso-formulario" role="alert">{{ mensagem }}</p>
    }

    <cw-barra-acoes>
      <a class="btn btn-secundario" routerLink="/pecas">Cancelar</a>
      <button type="submit" class="btn btn-primary" [disabled]="enviando()">
        {{ enviando() ? 'Salvando...' : editando() ? 'Salvar alterações' : 'Cadastrar peça' }}
      </button>
    </cw-barra-acoes>
  </form>
</cw-estado-lista>
